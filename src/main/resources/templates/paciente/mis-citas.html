<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1B5FA6">

    <title>Mis Citas | SANTOS Clínica médica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/mis-citas.css}"
          href="/css/mis-citas.css">

</head>


<body>


<main class="contenedor">


    <!-- MARCA -->
    <div class="marca">
        <span class="marca-simbolo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>
        </span>
        <span>SANTOS</span>
        <small>Clínica médica</small>
    </div>


    <!-- =================================================
         ENCABEZADO
         ================================================= -->

    <div class="encabezado-pagina">

        <div>

            <h1>
                Mis Citas
            </h1>

            <p>
                Consulte sus citas médicas registradas.
            </p>

        </div>

        <a th:href="@{/paciente/dashboard}"
           class="btn-volver">

            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>

            Volver al Portal

        </a>

    </div>


    <!-- =================================================
         SIN CITAS
         ================================================= -->

    <div th:if="${#lists.isEmpty(citas)}"
         class="sin-citas">

        <div class="sin-citas-icono" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 14l4 4M14 14l-4 4"/></svg>
        </div>

        <h2>
            No tiene citas registradas
        </h2>

        <p>
            Cuando agende una cita aparecerá
            en esta sección.
        </p>

    </div>


    <!-- =================================================
         LISTADO
         ================================================= -->

    <div th:if="${!#lists.isEmpty(citas)}"
         class="lista-citas">


        <article th:each="cita : ${citas}"
                 class="cita-card">

            <div class="cita-fila">


                <!-- CITA -->
                <div class="cita-dato">

                    <small>
                        Fecha y hora
                    </small>

                    <strong th:text="${#temporals.format(
                            cita.fechaHora,
                            'dd/MM/yyyy HH:mm'
                    )}">
                        14/08/2026 10:00
                    </strong>

                </div>


                <!-- MÉDICO -->
                <div class="cita-dato">

                    <small>
                        Médico
                    </small>

                    <strong th:text="${cita.medico}">
                        Médico
                    </strong>

                    <strong class="cita-sub"
                            th:text="${cita.especialidad}">
                        Especialidad
                    </strong>

                </div>


                <!-- SEDE -->
                <div class="cita-dato">

                    <small>
                        Sede
                    </small>

                    <strong th:text="${cita.sucursal}">
                        Sucursal
                    </strong>

                </div>


                <!-- ESTADO -->
                <div class="cita-estado">

                    <span class="badge-estado"

                          th:classappend="${#strings.equalsIgnoreCase(
                                cita.estado,
                                'Pagada'
                          )}
                          ? ' badge-pagada'
                          : (${#strings.equalsIgnoreCase(
                                cita.estado,
                                'Cancelada'
                          )}
                          ? ' badge-cancelada'
                          : ' badge-pendiente')"

                          th:text="${cita.estado}">
                        Estado
                    </span>

                </div>


            </div>

        </article>

    </div>


</main>


</body>

</html>
