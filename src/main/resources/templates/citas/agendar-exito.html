<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#1B5FA6">

    <title>Cita registrada | SANTOS Clínica médica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/cita-registrada.css}"
          href="/css/cita-registrada.css">

</head>


<body>

<main class="pagina">

    <!-- MARCA -->
    <div class="marca">
        <span class="marca-simbolo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>
        </span>
        <span>SANTOS</span>
        <small>Clínica médica</small>
    </div>

    <section class="tarjeta-resultado">

        <div class="icono-exito" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>
        </div>


        <h1>
            Cita registrada
        </h1>


        <div class="alerta-exito"
             role="status"
             th:text="${mensajeExito}">

            Su cita ha sido registrada exitosamente.

        </div>


        <p class="numero-cita">

            Número de cita:

            <strong th:text="${idCita}">
                0
            </strong>

        </p>


        <!--
        CU-04 todavía no está implementado.
        Posteriormente este botón llevará
        al proceso real de pago.
        -->

        <div class="acciones">

            <a th:href="@{/paciente/pagos/cita/{idCita}(idCita=${idCita})}"
               class="btn-primary">

                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>

                Continuar al pago

            </a>

        </div>

    </section>

</main>

</body>
</html>
