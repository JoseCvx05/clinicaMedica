<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cita registrada</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5 text-center">


                    <div class="mb-4">

                        <i class="bi bi-check-circle-fill
                                  text-success display-3"></i>

                    </div>


                    <h1 class="h3 fw-bold mb-3">
                        Cita registrada
                    </h1>


                    <div class="alert alert-success"
                         th:text="${mensajeExito}">

                        Su cita ha sido registrada exitosamente.

                    </div>


                    <p class="text-secondary">

                        Número de cita:

                        <strong th:text="${idCita}">
                            0
                        </strong>

                    </p>


                    <!--
                    CU-04 todavía no está implementado.
                    Posteriormente este botón llevará
                    al proceso real de pago.
                    -->

                    <a th:href="@{/paciente/pagos/cita/{idCita}(idCita=${idCita})}"
                       class="btn btn-primary">

                        <i class="bi bi-credit-card me-2"></i>

                        Continuar al pago

                    </a>


                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
