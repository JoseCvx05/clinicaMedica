# ==========================================================
# APLICACION
# ==========================================================

spring.application.name=clinicaMedica

# Si no se especifica un perfil, se usa LOCAL.
spring.profiles.default=local


# ==========================================================
# POSTGRESQL - CONFIGURACION COMUN
# ==========================================================

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

# La estructura de la BD se administra manualmente.
# Hibernate solamente valida las entidades.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false


# ==========================================================
# THYMELEAF
# ==========================================================

spring.thymeleaf.encoding=UTF-8


# ==========================================================
# SEGURIDAD - DATOS SENSIBLES
# ==========================================================

app.security.hmac-secret=${HMAC_SECRET}
app.security.aes-secret=${AES_SECRET}


# ==========================================================
# JWT
# ==========================================================

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-minutes=30

app.security.jwt-cookie-name=CLINICA_AUTH


# ==========================================================
# CORREO ELECTRONICO - SMTP
# ==========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==========================================================
# DATOS DEL HOSPITAL
# ==========================================================

hospital.nombre=Clinica Medica
hospital.telefono=XXXXXXXX


# ==========================================================
# REINTENTO DE CORREOS
# ==========================================================

correo.reintento.intervalo-ms=60000


# ==========================================================
# CU-03 - CITAS
# ==========================================================

cita.zona-horaria=America/Guatemala

cita.reserva.duracion-minutos=5
cita.reserva.limpieza-ms=60000

cita.pago.duracion-minutos=10
cita.pago.limpieza-ms=60000


# ==========================================================
# ANTIVIRUS - CLAMAV
# ==========================================================

antivirus.clamav.port=3310
antivirus.clamav.timeout-conexion-ms=3000
antivirus.clamav.timeout-lectura-ms=10000


# ==========================================================
# CU-03 - DOCUMENTOS DE CITAS
# ==========================================================

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

server.tomcat.max-http-form-post-size=4MB
server.tomcat.max-swallow-size=4MB


# ==========================================================
# REINTENTO DE NOTIFICACIONES
# ==========================================================

notificacion.reintento.intervalo-ms=60000


# ==========================================================
# SERVIDOR
# ==========================================================

# Local: 8080
# Azure: utilizará PORT si Azure lo proporciona.
server.port=${PORT:8080}