
name: Publicar Docker CU16 en GHCR

# Solo se ejecuta automáticamente en la rama Docker.
# No modifica los despliegues de Azure App Service.
on:
  push:
    branches:
      - docker-cu16

permissions:
  contents: read
  packages: write

jobs:
  publicar-imagen:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar nombre de imagen
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:cu16
            ${{ env.IMAGE }}:cu16-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
